AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Infrastructure-only stack for HyperPod EKS in an AWS Local Zone.
  Deploys VPC, subnets (parent AZ + Local Zone), EKS cluster with core add-ons,
  IAM role for HyperPod, and S3 bucket for lifecycle scripts.

  Does NOT install helm charts and does NOT create the SageMaker HyperPod cluster.
  Those two steps are done post-deploy by the companion scripts:
    ./install-helm.sh           - installs the HyperPod dependency helm chart
    ./create-hyperpod-cluster.sh - creates the AWS::SageMaker::Cluster resource

  This split follows the AWS reference workshop's "Manual HyperPod Cluster Creation"
  path, which is more robust than the Lambda-based helm installer in the reference CFN.

Parameters:
  ResourceNamePrefix:
    Type: String
    Default: hp-eks-lz
    AllowedPattern: '^[a-z][a-z0-9-]{2,20}$'
  VpcCidr:
    Type: String
    Default: 10.44.0.0/16
  PublicSubnet1Cidr:
    Type: String
    Default: 10.44.10.0/24
  PublicSubnet2Cidr:
    Type: String
    Default: 10.44.11.0/24
  EksControlPlaneSubnet1Cidr:
    Type: String
    Default: 10.44.100.0/28
  EksControlPlaneSubnet2Cidr:
    Type: String
    Default: 10.44.100.16/28
  # Secondary CIDR block used exclusively for the worker subnet in the LZ.
  WorkerSecondaryCidr:
    Type: String
    Default: 10.45.0.0/16
  WorkerSubnetCidr:
    Type: String
    Default: 10.45.0.0/24
  LocalZoneId:
    Type: String
    Default: usw2-phx2-az1
    AllowedPattern: '^[a-z]{3,4}[0-9](-[a-z0-9]+)?-az[0-9]$'
    Description: >
      AZ ID of the Local Zone where p5e workers live.
      Examples: usw2-phx2-az1 (Phoenix), use1-bos-az1 (Boston).
  KubernetesVersion:
    Type: String
    Default: '1.33'
    AllowedValues: ['1.30', '1.31', '1.32', '1.33', '1.34', '1.35']

  # FSx Lustre parameters. FSx Lustre in Local Zones is available in some LZs
  # (Phoenix supports PERSISTENT_2). See the LZ features matrix and note per-LZ
  # server-version quirks (LAX runs Lustre 2.10.5, which is incompatible with
  # AL2023's bundled 2.15.6 client - verified 2026-08-03).
  #
  # FsxLocation is the primary knob:
  #   none   - no FSx filesystem provisioned
  #   parent - FSx in the LZ's parent AZ, workers cross-zone mount (~1-5 ms per
  #            syscall overhead; metadata-heavy workloads suffer badly - the
  #            customer's Phoenix cluster measured this at 33x for 50 file
  #            creates on OpenZFS and worse on Lustre)
  #   lz     - FSx co-located with compute in the LZ subnet (recommended when
  #            the target LZ supports it; verified in Phoenix with PERSISTENT_2)
  #
  # The legacy CreateFsx / CreateFsxInLZ inputs are still honored for backward
  # compatibility, but FsxLocation takes precedence when explicitly set.
  FsxLocation:
    Type: String
    Default: parent
    AllowedValues: [none, parent, lz]
    Description: >
      Where to place the FSx Lustre filesystem: none | parent | lz.
      Recommended: lz (co-located, no cross-zone latency).
      Default parent is the shipped-safe choice for LZs that do not yet offer
      FSx or offer only incompatible tiers.
  CreateFsx:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      LEGACY. Prefer FsxLocation. Kept for backward compatibility.
      Ignored when FsxLocation is explicitly set to 'none' or 'lz'.
  CreateFsxInLZ:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      LEGACY. Prefer FsxLocation=lz. Kept for backward compatibility.
      When true (and FsxLocation is at its default), provisions an FSx in the
      LZ subnet ADDITIONALLY to the parent-AZ one - this is almost never what
      you want; use FsxLocation=lz to place a single filesystem in the LZ.
  FsxStorageCapacityGiB:
    Type: Number
    Default: 1200
    MinValue: 1200
    Description: FSx Lustre capacity in GiB (min 1200 for PERSISTENT_2).
  FsxPerUnitStorageThroughput:
    Type: Number
    Default: 250
    AllowedValues: [125, 250, 500, 1000]
    Description: FSx Lustre throughput per TiB (MB/s per TiB). Note LZ FSx may support fewer tiers than parent-AZ FSx.
  CreateS3MountpointBucket:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Whether to create an S3 bucket + IAM role for use with the S3 Mountpoint CSI driver.

  # ==================== Local Zone egress ====================
  # By default (LocalZoneEgress=false) LZ workers reach the internet through a
  # NAT gateway in the parent Region. This hairpins every packet ~24-35 ms to
  # the parent AZ (measured: LAX->us-west-2b hop1 = 23.8 ms; matches the customer's
  # Phoenix->us-west-2a measurement of ~35 ms). Symptom: slow pip/apt/curl,
  # 258 Mbps download, single-stream TCP BDP-limited to a small window.
  #
  # LocalZoneEgress=true adds an LZ-local NAT gateway with a NetworkBorderGroup-
  # scoped EIP, splits the LZ worker subnet onto its own route table, and points
  # 0.0.0.0/0 at the LZ NAT. Measured in LAX (2026-08-03): PyPI TTFB 111 ms ->
  # 17 ms (6.5x); PyPI throughput 56 MB/s -> 311 MB/s (5.6x); Cloudflare 25 MB
  # 565 ms -> 132 ms (4.3x). Does NOT help origin-anchored services (github,
  # huggingface see ~5% improvement).
  #
  # Requires:
  #   - LocalZoneName: the LZ's zone NAME (e.g. us-west-2-lax-1a). Used to
  #     derive NetworkBorderGroup by stripping the trailing zone letter.
  #     CFN cannot look this up from LocalZoneId at synth time.
  #   - LzPublicSubnetCidr: a public subnet in the LZ (default carved from the
  #     worker secondary CIDR 10.45.0.0/16, next /24 after WorkerSubnetCidr).
  LocalZoneEgress:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: >
      false (default) = LZ workers egress via parent-AZ NAT (customer's current
      topology, ~24-35 ms hairpin per packet).
      true = LZ workers egress via LZ-local NAT (measured 4-6x internet
      speedup, 250x first-hop RTT improvement).
  LocalZoneName:
    Type: String
    Default: us-west-2-phx-2a
    AllowedPattern: '^[a-z]{2}-[a-z]+-[0-9]+-[a-z]+-[0-9]+[a-z]$'
    Description: >
      Zone NAME of the Local Zone (matches LocalZoneId's parent zone name).
      Currently informational; kept in sync with LocalZoneId for future use.
      Examples: us-west-2-phx-2a (Phoenix), us-west-2-lax-1a (LA).
  NetworkBorderGroup:
    Type: String
    Default: us-west-2-phx-2
    AllowedPattern: '^[a-z]{2}-[a-z]+-[0-9]+-[a-z]+-[0-9]+$'
    Description: >
      NetworkBorderGroup for the LZ NAT's EIP. REQUIRED when
      LocalZoneEgress=true - a plain vpc-scoped EIP cannot attach to a NAT in
      an LZ subnet. The border group is the LocalZoneName minus the trailing
      zone letter: us-west-2-phx-2a -> us-west-2-phx-2. This is a separate
      parameter (rather than derived from LocalZoneName) because CFN's string
      functions do not do reliable suffix-strip on multi-letter zone names.
  LzPublicSubnetCidr:
    Type: String
    Default: 10.45.1.0/24
    Description: >
      Public subnet in the LZ, only used when LocalZoneEgress=true. Carved
      from the WorkerSecondaryCidr block, adjacent to WorkerSubnetCidr.

Conditions:
  ShouldUseLzEgress: !Equals [!Ref LocalZoneEgress, 'true']

  # FSx placement. FsxLocation is the primary control. The legacy
  # CreateFsx / CreateFsxInLZ inputs are honored ONLY when FsxLocation is at
  # its default value ('parent') - that keeps existing stacks that never set
  # FsxLocation working exactly as before.
  #
  # Truth table for the derived conditions:
  #   FsxLocation | CreateFsx | CreateFsxInLZ | Parent?  LZ?
  #   none        | *         | *             | no       no
  #   parent      | true      | false         | yes      no      (default)
  #   parent      | false     | false         | no       no
  #   parent      | true      | true          | yes      yes     (legacy dual)
  #   parent      | false     | true          | no       yes     (legacy lz-only)
  #   lz          | *         | *             | no       yes
  FsxLocationIsParent: !Equals [!Ref FsxLocation, parent]
  FsxLocationIsLz:     !Equals [!Ref FsxLocation, lz]
  LegacyCreateFsx:     !Equals [!Ref CreateFsx, 'true']
  LegacyCreateFsxInLZ: !Equals [!Ref CreateFsxInLZ, 'true']
  ShouldCreateFsx: !And
    - !Condition FsxLocationIsParent
    - !Condition LegacyCreateFsx
  ShouldCreateFsxInLZ: !Or
    - !Condition FsxLocationIsLz
    - !And
      - !Condition FsxLocationIsParent
      - !Condition LegacyCreateFsxInLZ
  # Used to gate the shared FSx security group + its rules. The SG must exist
  # whenever any FSx filesystem is created.
  ShouldCreateAnyFsx: !Or
    - !Condition ShouldCreateFsx
    - !Condition ShouldCreateFsxInLZ

  ShouldCreateS3MountpointBucket: !Equals [!Ref CreateS3MountpointBucket, 'true']

Mappings:
  # For us-west-2 the LZ parent (both Phoenix usw2-phx2-az1 and LAX usw2-lax1-az1)
  # is us-west-2b. PublicSubnet1 hosts the NAT gateway when LocalZoneEgress=false,
  # so it MUST be the parent AZ - otherwise LZ egress takes an extra inter-AZ hop
  # through us-west-2a before hairpinning to the LZ. This was the shipped
  # default until 2026-08-03; the swap below is the fix.
  #
  # NOTE: LZ->parent-AZ hairpin still costs ~24-35 ms even with the correct AZ;
  # for a real fix, set LocalZoneEgress=true (adds an LZ-local NAT).
  RegionAzs:
    us-west-2:
      StandardAz1: us-west-2b   # parent AZ of the LZ - hosts NAT + first EKS ENI
      StandardAz2: us-west-2a   # the other standard AZ - second EKS ENI only

Resources:

  # ==================== VPC + Subnets ====================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-vpc

  VpcSecondaryCidr:
    Type: AWS::EC2::VPCCidrBlock
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref WorkerSecondaryCidr

  Igw:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-igw

  IgwAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref Igw

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !FindInMap [RegionAzs, !Ref 'AWS::Region', StandardAz1]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-public-az1
        - Key: kubernetes.io/role/elb
          Value: '1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !FindInMap [RegionAzs, !Ref 'AWS::Region', StandardAz2]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-public-az2
        - Key: kubernetes.io/role/elb
          Value: '1'

  # Small /28 subnets dedicated to EKS control-plane ENIs (in standard AZs only).
  EksSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref EksControlPlaneSubnet1Cidr
      AvailabilityZone: !FindInMap [RegionAzs, !Ref 'AWS::Region', StandardAz1]
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-eks-cp-az1

  EksSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref EksControlPlaneSubnet2Cidr
      AvailabilityZone: !FindInMap [RegionAzs, !Ref 'AWS::Region', StandardAz2]
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-eks-cp-az2

  # Worker subnet in the Local Zone (uses AvailabilityZoneId, not zone name).
  # NOTE: this is NOT passed to the EKS control plane - EKS cannot create ENIs
  # in a Local Zone. HyperPod attaches its workers here via
  # AWS::SageMaker::Cluster.VpcConfig.Subnets.
  WorkerSubnet:
    Type: AWS::EC2::Subnet
    DependsOn: VpcSecondaryCidr
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref WorkerSubnetCidr
      AvailabilityZoneId: !Ref LocalZoneId
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-worker-lz

  # LZ public subnet - only when LocalZoneEgress=true. Hosts the LZ NAT so
  # that LZ workers can egress locally instead of hairpinning to the parent
  # Region. Carved from the same secondary CIDR block as WorkerSubnet.
  LzPublicSubnet:
    Type: AWS::EC2::Subnet
    Condition: ShouldUseLzEgress
    DependsOn: VpcSecondaryCidr
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref LzPublicSubnetCidr
      AvailabilityZoneId: !Ref LocalZoneId
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-lz-public

  # ==================== NAT + Routing ====================
  # Parent-AZ NAT: always created. In the default topology (LocalZoneEgress=false)
  # this is the LZ workers' egress path. When LocalZoneEgress=true the parent
  # NAT is still available for the EKS control-plane subnets (which cannot
  # reach an LZ NAT).
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: IgwAttach
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-nat

  # LZ NAT + border-group EIP (only when LocalZoneEgress=true).
  # NetworkBorderGroup on the EIP is REQUIRED: a plain 'Domain: vpc' EIP is
  # region-scoped and cannot attach to a NAT gateway in an LZ subnet. The border
  # group is the zone name minus the trailing letter (us-west-2-phx-2a ->
  # us-west-2-phx-2). Verified end-to-end in LAX 2026-08-03.
  LzNatEip:
    Type: AWS::EC2::EIP
    Condition: ShouldUseLzEgress
    DependsOn: IgwAttach
    Properties:
      Domain: vpc
      NetworkBorderGroup: !Ref NetworkBorderGroup
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-lz-nat-eip

  LzNatGateway:
    Type: AWS::EC2::NatGateway
    Condition: ShouldUseLzEgress
    Properties:
      AllocationId: !GetAtt LzNatEip.AllocationId
      SubnetId: !Ref LzPublicSubnet
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-lz-nat

  PublicRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-public-rt

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref PublicRt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  PublicSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRt

  PublicSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRt

  # LZ public route table (only when LocalZoneEgress=true). LZ subnets can
  # route to a regional IGW; AWS handles the LZ<->IGW path transparently.
  LzPublicRt:
    Type: AWS::EC2::RouteTable
    Condition: ShouldUseLzEgress
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-lz-public-rt

  LzPublicRoute:
    Type: AWS::EC2::Route
    Condition: ShouldUseLzEgress
    DependsOn: IgwAttach
    Properties:
      RouteTableId: !Ref LzPublicRt
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref Igw

  LzPublicSubnetAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: ShouldUseLzEgress
    Properties:
      SubnetId: !Ref LzPublicSubnet
      RouteTableId: !Ref LzPublicRt

  # Parent-AZ private route table - used by EKS control-plane subnets (which
  # cannot live in an LZ). Always routes to the parent-AZ NAT.
  PrivateRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-private-rt

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRt
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  # LZ private route table - dedicated to the WorkerSubnet. Split unconditionally
  # from PrivateRt so that LZ traffic can route independently of the parent-AZ
  # EKS subnets. The default route selects the NAT based on LocalZoneEgress.
  LzPrivateRt:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-lz-private-rt

  LzPrivateDefault:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref LzPrivateRt
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !If [ShouldUseLzEgress, !Ref LzNatGateway, !Ref NatGateway]

  EksSubnet1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EksSubnet1
      RouteTableId: !Ref PrivateRt

  EksSubnet2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref EksSubnet2
      RouteTableId: !Ref PrivateRt

  WorkerSubnetAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref WorkerSubnet
      RouteTableId: !Ref LzPrivateRt

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PublicRt
        - !Ref PrivateRt
        - !Ref LzPrivateRt

  # ==================== Security Group ====================
  # EFA-friendly: intra-SG all traffic, egress 0.0.0.0/0, FSx Lustre ports.
  # Matches AWS reference architecture pattern.
  ClusterSg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub ${ResourceNamePrefix} EFA/HyperPod SG
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-sg

  SgIngressSelf:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ClusterSg
      IpProtocol: '-1'
      SourceSecurityGroupId: !Ref ClusterSg

  SgEgressSelf:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ClusterSg
      IpProtocol: '-1'
      DestinationSecurityGroupId: !Ref ClusterSg

  SgEgressAll:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ClusterSg
      IpProtocol: '-1'
      CidrIp: 0.0.0.0/0

  # ==================== IAM Roles ====================
  EksClusterRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourceNamePrefix}-eks-cluster-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: eks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSClusterPolicy

  # SageMaker HyperPod execution role.
  # Same permission surface as the reference sagemaker-iam-role-stack.yaml.
  HyperPodExecRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${ResourceNamePrefix}-hp-exec-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSageMakerClusterInstanceRolePolicy
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
      Policies:
        - PolicyName: hp-extras
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ec2:AssignPrivateIpAddresses
                  - ec2:CreateNetworkInterface
                  - ec2:CreateNetworkInterfacePermission
                  - ec2:DeleteNetworkInterface
                  - ec2:DeleteNetworkInterfacePermission
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DescribeSubnets
                  - ec2:DescribeVpcs
                  - ec2:DetachNetworkInterface
                  - ec2:ModifyNetworkInterfaceAttribute
                  - ec2:UnassignPrivateIpAddresses
                Resource: '*'
              - Effect: Allow
                Action: ec2:CreateTags
                Resource: '*'
                Condition:
                  StringEquals:
                    'ec2:CreateAction': ['CreateNetworkInterface']
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetAuthorizationToken
                  - ecr:GetDownloadUrlForLayer
                Resource: '*'
              - Effect: Allow
                Action: eks-auth:AssumeRoleForPodIdentity
                Resource: '*'
              - Effect: Allow
                Action: cloudwatch:DescribeAlarms
                Resource: '*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !GetAtt LifecycleBucket.Arn
                  - !Sub ${LifecycleBucket.Arn}/*

  # ==================== S3 Bucket ====================
  LifecycleBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${ResourceNamePrefix}-lifecycle-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # ==================== FSx Lustre (parent AZ, cross-zone mounted from LZ) ====================
  # FSx is not offered in most Local Zones. We place the file system in the LZ's parent AZ
  # (us-west-2b for PHX LZ) and mount it from LZ workers over the VPC's cross-zone link.
  # Expected latency overhead vs. same-AZ FSx: ~1-5 ms per syscall. Fine for streamed reads.

  FsxSg:
    Type: AWS::EC2::SecurityGroup
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupDescription: FSx Lustre - Lustre client control (988) + data (1018-1023)
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-fsx-sg

  # FSx Lustre requires bidirectional rules between the cluster SG and the FSx SG,
  # plus self-referential rules on the FSx SG for LNET peer communication.
  FsxSgIngressFromClusterCtl:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupId: !Ref FsxSg
      IpProtocol: tcp
      FromPort: 988
      ToPort: 988
      SourceSecurityGroupId: !Ref ClusterSg
      Description: Lustre client control from cluster

  FsxSgIngressFromClusterData:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupId: !Ref FsxSg
      IpProtocol: tcp
      FromPort: 1018
      ToPort: 1023
      SourceSecurityGroupId: !Ref ClusterSg
      Description: Lustre data from cluster

  FsxSgIngressSelf988:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupId: !Ref FsxSg
      IpProtocol: tcp
      FromPort: 988
      ToPort: 988
      SourceSecurityGroupId: !Ref FsxSg
      Description: LNET peer

  FsxSgIngressSelfData:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupId: !Ref FsxSg
      IpProtocol: tcp
      FromPort: 1018
      ToPort: 1023
      SourceSecurityGroupId: !Ref FsxSg
      Description: Lustre data peer

  FsxSgEgressToCluster988:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupId: !Ref FsxSg
      IpProtocol: tcp
      FromPort: 988
      ToPort: 988
      DestinationSecurityGroupId: !Ref ClusterSg
      Description: LNET to cluster clients

  FsxSgEgressToClusterData:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupId: !Ref FsxSg
      IpProtocol: tcp
      FromPort: 1018
      ToPort: 1023
      DestinationSecurityGroupId: !Ref ClusterSg
      Description: Lustre data to cluster clients

  FsxSgEgressSelf988:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupId: !Ref FsxSg
      IpProtocol: tcp
      FromPort: 988
      ToPort: 988
      DestinationSecurityGroupId: !Ref FsxSg

  FsxSgEgressSelfData:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupId: !Ref FsxSg
      IpProtocol: tcp
      FromPort: 1018
      ToPort: 1023
      DestinationSecurityGroupId: !Ref FsxSg

  # Cluster SG needs explicit egress to FSx SG for Lustre ports. The blanket
  # egress-to-0.0.0.0/0 rule technically covers this, but adding SG-specific
  # rules is clearer and future-proofs against tightening egress.
  ClusterSgEgressFsx988:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupId: !Ref ClusterSg
      IpProtocol: tcp
      FromPort: 988
      ToPort: 988
      DestinationSecurityGroupId: !Ref FsxSg

  ClusterSgEgressFsxData:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: ShouldCreateAnyFsx
    Properties:
      GroupId: !Ref ClusterSg
      IpProtocol: tcp
      FromPort: 1018
      ToPort: 1023
      DestinationSecurityGroupId: !Ref FsxSg

  FsxFileSystem:
    Type: AWS::FSx::FileSystem
    Condition: ShouldCreateFsx
    Properties:
      FileSystemType: LUSTRE
      StorageCapacity: !Ref FsxStorageCapacityGiB
      # FSx lives in the parent AZ (us-west-2b), NOT the LZ. Workers cross-zone mount.
      SubnetIds:
        - !Ref PublicSubnet2
      SecurityGroupIds:
        - !Ref FsxSg
      LustreConfiguration:
        DeploymentType: PERSISTENT_2
        PerUnitStorageThroughput: !Ref FsxPerUnitStorageThroughput
        DataCompressionType: LZ4
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-fsx

  # ------ Optional: second FSx Lustre in the LZ subnet -------
  # FSx Lustre in Phoenix LZ supports PERSISTENT_2 with 125 or 250 MB/s per TiB.
  # Set CreateFsxInLZ=true and this will provision a second file system co-located
  # with the compute (no cross-zone latency).
  FsxInLZ:
    Type: AWS::FSx::FileSystem
    Condition: ShouldCreateFsxInLZ
    Properties:
      FileSystemType: LUSTRE
      StorageCapacity: !Ref FsxStorageCapacityGiB
      SubnetIds:
        - !Ref WorkerSubnet
      SecurityGroupIds:
        - !Ref FsxSg
      LustreConfiguration:
        DeploymentType: PERSISTENT_2
        PerUnitStorageThroughput: !Ref FsxPerUnitStorageThroughput
        DataCompressionType: LZ4
      Tags:
        - Key: Name
          Value: !Sub ${ResourceNamePrefix}-fsx-in-lz

  # ------ Optional: S3 bucket + IAM role for S3 Mountpoint CSI driver -------
  S3MountpointBucket:
    Type: AWS::S3::Bucket
    Condition: ShouldCreateS3MountpointBucket
    Properties:
      BucketName: !Sub ${ResourceNamePrefix}-s3mp-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # IAM role for the S3 Mountpoint CSI driver's ServiceAccount, wired up via
  # EKS Pod Identity. The role grants access ONLY to the S3 Mountpoint bucket
  # above; scope to more buckets by editing the Resource ARNs.
  S3MountpointRole:
    Type: AWS::IAM::Role
    Condition: ShouldCreateS3MountpointBucket
    Properties:
      RoleName: !Sub ${ResourceNamePrefix}-s3-mountpoint-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pods.eks.amazonaws.com
            Action: [sts:AssumeRole, sts:TagSession]
      Policies:
        - PolicyName: S3MountpointBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt S3MountpointBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:AbortMultipartUpload
                Resource: !Sub ${S3MountpointBucket.Arn}/*

  # Wire the CSI driver's ServiceAccount (s3-csi-driver-sa in kube-system) to
  # the role above. Requires the S3 Mountpoint CSI Helm chart to be installed
  # (see install-helm.sh).
  S3MountpointPodIdentity:
    Type: AWS::EKS::PodIdentityAssociation
    Condition: ShouldCreateS3MountpointBucket
    Properties:
      ClusterName: !Ref EksCluster
      Namespace: kube-system
      ServiceAccount: s3-csi-driver-sa
      RoleArn: !GetAtt S3MountpointRole.Arn

  # ==================== EKS Cluster + Add-ons ====================
  EksCluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub ${ResourceNamePrefix}-eks
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt EksClusterRole.Arn
      ResourcesVpcConfig:
        SubnetIds:
          - !Ref EksSubnet1
          - !Ref EksSubnet2
        SecurityGroupIds:
          - !Ref ClusterSg
        EndpointPublicAccess: true
        EndpointPrivateAccess: true
      AccessConfig:
        AuthenticationMode: API_AND_CONFIG_MAP
        BootstrapClusterCreatorAdminPermissions: true

  VpcCniAddon:
    Type: AWS::EKS::Addon
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: vpc-cni
      ResolveConflicts: OVERWRITE

  KubeProxyAddon:
    Type: AWS::EKS::Addon
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: kube-proxy
      ResolveConflicts: OVERWRITE

  CorednsAddon:
    Type: AWS::EKS::Addon
    DependsOn: [EksCluster, VpcCniAddon]
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: coredns
      ResolveConflicts: OVERWRITE

  PodIdentityAgentAddon:
    Type: AWS::EKS::Addon
    DependsOn: EksCluster
    Properties:
      ClusterName: !Ref EksCluster
      AddonName: eks-pod-identity-agent
      ResolveConflicts: OVERWRITE

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub ${AWS::StackName}-VpcId
  WorkerSubnetId:
    Value: !Ref WorkerSubnet
    Description: LZ worker subnet used by the HyperPod accelerated instance group
    Export:
      Name: !Sub ${AWS::StackName}-WorkerSubnetId
  SecurityGroupId:
    Value: !Ref ClusterSg
    Export:
      Name: !Sub ${AWS::StackName}-SecurityGroupId
  EksClusterName:
    Value: !Ref EksCluster
    Export:
      Name: !Sub ${AWS::StackName}-EksClusterName
  EksClusterArn:
    Value: !GetAtt EksCluster.Arn
    Export:
      Name: !Sub ${AWS::StackName}-EksClusterArn
  EksClusterEndpoint:
    Value: !GetAtt EksCluster.Endpoint
  HyperPodExecRoleArn:
    Value: !GetAtt HyperPodExecRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-HyperPodExecRoleArn
  LifecycleBucket:
    Value: !Ref LifecycleBucket
    Export:
      Name: !Sub ${AWS::StackName}-LifecycleBucket
  FsxFileSystemId:
    Condition: ShouldCreateFsx
    Value: !Ref FsxFileSystem
    Description: FSx Lustre file system ID (in the parent AZ)
    Export:
      Name: !Sub ${AWS::StackName}-FsxFileSystemId
  FsxDnsName:
    Condition: ShouldCreateFsx
    Value: !GetAtt FsxFileSystem.DNSName
    Description: FSx Lustre DNS name (used by the k8s PersistentVolume)
    Export:
      Name: !Sub ${AWS::StackName}-FsxDnsName
  FsxMountName:
    Condition: ShouldCreateFsx
    Value: !GetAtt FsxFileSystem.LustreMountName
    Description: FSx Lustre mount name (needed for mount command / PersistentVolume)
    Export:
      Name: !Sub ${AWS::StackName}-FsxMountName
  FsxInLZFileSystemId:
    Condition: ShouldCreateFsxInLZ
    Value: !Ref FsxInLZ
    Description: FSx Lustre in the LZ subnet (co-located with compute)
    Export:
      Name: !Sub ${AWS::StackName}-FsxInLZFileSystemId
  FsxInLZDnsName:
    Condition: ShouldCreateFsxInLZ
    Value: !GetAtt FsxInLZ.DNSName
    Export:
      Name: !Sub ${AWS::StackName}-FsxInLZDnsName
  FsxInLZMountName:
    Condition: ShouldCreateFsxInLZ
    Value: !GetAtt FsxInLZ.LustreMountName
    Export:
      Name: !Sub ${AWS::StackName}-FsxInLZMountName
  S3MountpointBucketName:
    Condition: ShouldCreateS3MountpointBucket
    Value: !Ref S3MountpointBucket
    Description: S3 bucket to be mounted by pods via the S3 Mountpoint CSI driver
    Export:
      Name: !Sub ${AWS::StackName}-S3MountpointBucketName
  S3MountpointRoleArn:
    Condition: ShouldCreateS3MountpointBucket
    Value: !GetAtt S3MountpointRole.Arn
    Export:
      Name: !Sub ${AWS::StackName}-S3MountpointRoleArn
  KubeconfigCommand:
    Value: !Sub aws eks update-kubeconfig --name ${EksCluster} --region ${AWS::Region}
    Description: Run this locally to configure kubectl for this cluster
  LzNatGatewayId:
    Condition: ShouldUseLzEgress
    Value: !Ref LzNatGateway
    Description: LZ-local NAT gateway ID (used by workers when LocalZoneEgress=true)
  LzNatEipAddress:
    Condition: ShouldUseLzEgress
    Value: !Ref LzNatEip
    Description: Public IP of the LZ NAT (allocated in the NetworkBorderGroup of the LZ)
  LzPublicSubnetId:
    Condition: ShouldUseLzEgress
    Value: !Ref LzPublicSubnet
    Description: Public subnet in the LZ (only present when LocalZoneEgress=true)
