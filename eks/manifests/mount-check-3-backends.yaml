# Sample: pod that mounts all 3 storage backends and does a mount-check
#
# Prereqs: benchmark PV/PVCs applied
# Apply:  kubectl apply -f mount-check-3-backends.yaml
apiVersion: v1
kind: Pod
metadata:
  name: mount-check-3
  namespace: default
spec:
  restartPolicy: Never
  serviceAccountName: default
  nodeSelector:
    sagemaker.amazonaws.com/instance-group-name: accelerated
  containers:
    - name: check
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      command: ["/bin/bash", "-c"]
      args:
        - |
          set -ex
          echo "=== Mounts ==="
          df -h /fsx-parent /fsx-lz /s3mp 2>&1 || true
          echo ""
          for path in /fsx-parent /fsx-lz /s3mp; do
            echo "=== $path ==="
            ls -la "$path" 2>&1 | head -5 || echo "ls failed on $path"
            echo ""
          done
          echo "=== Quick write test on FSx-LZ ==="
          echo "hello" > /fsx-lz/hello-from-mount-check.txt && cat /fsx-lz/hello-from-mount-check.txt && rm /fsx-lz/hello-from-mount-check.txt
          echo ""
          echo "=== Quick write test on S3 Mountpoint ==="
          echo "hello" > /s3mp/hello-from-mount-check.txt && cat /s3mp/hello-from-mount-check.txt && rm /s3mp/hello-from-mount-check.txt
          echo ""
          echo "=== ALL BACKENDS WORKING ==="
      volumeMounts:
        - {name: fsx-parent, mountPath: /fsx-parent}
        - {name: fsx-lz, mountPath: /fsx-lz}
        - {name: s3mp, mountPath: /s3mp}
  volumes:
    - name: fsx-parent
      persistentVolumeClaim:
        claimName: fsx-lustre-pvc
    - name: fsx-lz
      persistentVolumeClaim:
        claimName: fsx-lz-pvc
    - name: s3mp
      persistentVolumeClaim:
        claimName: s3mp-pvc
